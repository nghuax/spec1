<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090D">
  <meta name="description" content="HARM — Stage 1 interactive p5-2026-09-22-v01.js generative artwork about fossil energy, coal combustion, industrial emissions, and local air pollution for SDG 7.">
  <title>HARM — Stage 1</title>
  <link rel="stylesheet" href="style-2026-09-22-v01.css">
<link rel="stylesheet" href="../../css/fonts-2026-09-22-v01.css"><link rel="stylesheet" href="../exhibition-bridge-2026-09-22-v01.css"></head>
<body>
  <main id="app" aria-label="HARM interactive generative art about coal combustion and air pollution">
    <div id="canvas-holder">
      <div id="sample-ui" class="stage2-figma-ui" aria-label="HARM Stage 1 interface">
        <header class="harm-caption">STAGE 1: HARM</header>

        <aside id="air-load-hud" class="air-load-hud" aria-label="Atmospheric pressure">
          <div class="air-load-hud__head">
            <span class="air-load-hud__label">AIR LOAD</span>
            <output id="air-load-value" class="air-load-hud__value" aria-label="Air load percentage">0%</output>
          </div>
          <div class="air-load-hud__track" aria-hidden="true">
            <span id="air-load-fill" class="air-load-hud__fill"></span>
          </div>
          <p class="air-load-hud__caption">Atmospheric pressure</p>
        </aside>

        <div class="stage2-subtitle is-visible" aria-live="polite">
          <p id="status-message" class="stage2-subtitle-text"></p>
        </div>

        <section id="sound-control" class="sound-control" aria-label="Sound controls">
          <button id="sound-button" class="figma-control ambience-trigger" type="button" aria-expanded="false" aria-controls="sound-settings" data-tooltip="Sound mix">
            <svg class="figma-control-shell" viewBox="0 0 169 159.523" aria-hidden="true">
              <path d="M42.6449 33.1682L169 0V159.523H42.6449V33.1682Z" fill="white" />
              <path d="M36.9589 28.7458H163.314V155.101H7.26542L36.9589 28.7458Z" fill="black" />
              <path d="M0 19.585H152.258L141.5 132L28.7221 145.624L0 19.585Z" fill="currentColor" />
            </svg>
            <svg class="figma-control-icon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M3 12h6l7-7v22l-7-7H3Z" fill="currentColor" stroke="none" />
              <path d="M21 10c4 3 4 9 0 12m5-17c7 6 7 16 0 22" />
            </svg>
            <span class="figma-control-mute-cross" aria-hidden="true"></span>
          </button>

          <div id="sound-settings" class="sound-settings" hidden>
            <div class="sound-settings__head">
              <div>
                <span>SOUND MIX</span>
                <small>DESIGNED AUDIO</small>
              </div>
              <button id="sound-settings-close" class="sound-settings__close" type="button" aria-label="Close sound mix">×</button>
            </div>
            <p class="sound-settings__hint">FILE NAME <b>(RECOMMENDED)</b> · CURRENT LEVEL</p>

            <div class="sound-mix-list" aria-label="Master, ambience and nine sound levels">
              <label class="sound-mix-row sound-mix-row--master">
                <span class="sound-mix-row__label">MASTER <b>(100%)</b></span>
                <input data-sound-master type="range" min="0" max="100" step="1" value="80" aria-label="Master sound level, recommended 100 percent">
                <output data-sound-master-value>80%</output>
              </label>
              <label class="sound-mix-row sound-mix-row--ambience">
                <span class="sound-mix-row__label">AMBIENCE <b>(50%)</b></span>
                <input data-sound-ambience type="range" min="0" max="100" step="1" value="50" aria-label="Ambient soundscape density, recommended 50 percent">
                <output data-sound-ambience-value>56%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">KEYBOARD REVERSE <b>(20%)</b></span>
                <input data-sound-key="hover" type="range" min="0" max="100" step="1" value="20" aria-label="Keyboard Reverse sound level, recommended 20 percent">
                <output data-sound-value="hover">20%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">MOUSECLICK <b>(52%)</b></span>
                <input data-sound-key="mouseclick" type="range" min="0" max="100" step="1" value="52" aria-label="Mouseclick sound level, recommended 52 percent">
                <output data-sound-value="mouseclick">52%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">EXHAUST <b>(38%)</b></span>
                <input data-sound-key="exhaust" type="range" min="0" max="100" step="1" value="38" aria-label="Exhaust sound level, recommended 38 percent">
                <output data-sound-value="exhaust">38%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">MICROWAVE <b>(40%)</b></span>
                <input data-sound-key="microwave" type="range" min="0" max="100" step="1" value="40" aria-label="Microwave sound level, recommended 40 percent">
                <output data-sound-value="microwave">40%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">WATER TAP <b>(13%)</b></span>
                <input data-sound-key="water" type="range" min="0" max="100" step="1" value="13" aria-label="Water Tap sound level, recommended 13 percent">
                <output data-sound-value="water">13%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">RICE <b>(14%)</b></span>
                <input data-sound-key="rice" type="range" min="0" max="100" step="1" value="14" aria-label="Rice sound level, recommended 14 percent">
                <output data-sound-value="rice">14%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">ORAL IRRIGATOR <b>(14%)</b></span>
                <input data-sound-key="irrigator" type="range" min="0" max="100" step="1" value="14" aria-label="Oral Irrigator sound level, recommended 14 percent">
                <output data-sound-value="irrigator">14%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">PLASTICBAG <b>(18%)</b></span>
                <input data-sound-key="plastic" type="range" min="0" max="100" step="1" value="18" aria-label="PlasticBag sound level, recommended 18 percent">
                <output data-sound-value="plastic">18%</output>
              </label>
              <label class="sound-mix-row">
                <span class="sound-mix-row__label">CAR SIGNAL <b>(18%)</b></span>
                <input data-sound-key="alert" type="range" min="0" max="100" step="1" value="18" aria-label="Car Signal sound level, recommended 18 percent">
                <output data-sound-value="alert">18%</output>
              </label>
            </div>

            <div class="sound-settings__foot">
              <span>() = RECOMMENDED · AMBIENCE CONTROLS BACKGROUND DENSITY</span>
              <div class="sound-settings__actions">
                <button id="sound-mute-toggle" class="sound-mute" type="button" aria-pressed="false">
                  <svg class="sound-mute__icon" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M3 12h6l7-7v22l-7-7H3Z" fill="currentColor" stroke="none" />
                    <path class="sound-mute__waves" d="M21 10c4 3 4 9 0 12m5-17c7 6 7 16 0 22" />
                    <path class="sound-mute__cross" d="M22 12l7 7m0-7l-7 7" />
                  </svg>
                  <span class="sound-mute__label">MUTE</span>
                </button>
                <button id="sound-reset-recommended" class="sound-reset" type="button">USE RECOMMENDED</button>
              </div>
            </div>
          </div>
        </section>

        <button id="reset-ui" class="figma-control reset-trigger" type="button" aria-label="Reset artwork" data-tooltip="Reset artwork · R">
          <svg class="figma-control-shell" viewBox="0 0 169 159.523" aria-hidden="true">
            <path d="M42.6449 33.1682L169 0V159.523H42.6449V33.1682Z" fill="white" />
            <path d="M36.9589 28.7458H163.314V155.101H7.26542L36.9589 28.7458Z" fill="black" />
            <path d="M0 19.585H152.258L141.5 132L28.7221 145.624L0 19.585Z" fill="currentColor" />
          </svg>
          <svg class="figma-control-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 12a11 11 0 1 1 0 9M6 4v8h8" />
          </svg>
        </button>

        <button id="info-ui" class="figma-control information-trigger" type="button" aria-label="Open HARM research" data-tooltip="Research · I">
          <svg class="figma-control-shell" viewBox="0 0 169 159.523" aria-hidden="true">
            <path d="M42.6449 33.1682L169 0V159.523H42.6449V33.1682Z" fill="white" />
            <path d="M36.9589 28.7458H163.314V155.101H7.26542L36.9589 28.7458Z" fill="black" />
            <path d="M0 19.585H152.258L141.5 132L28.7221 145.624L0 19.585Z" fill="currentColor" />
          </svg>
          <svg class="figma-info-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M13 3h6l-1 18h-4Z M13 25h6v6h-6Z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="p5-2026-09-22-v01.js"></script>
  <script src="mastered-audio-2026-09-22-v01.js?v=1"></script>
  <script src="sound-2026-09-22-v01.js?v=master1"></script>
  <script src="sketch-2026-09-22-v01.js"></script>
  <script src="js/scene-2026-09-22-v01.js"></script>
  <script src="js/systems-2026-09-22-v01.js"></script>
  <script src="js/render-2026-09-22-v01.js"></script>
  <script src="js/interface-2026-09-22-v01.js"></script>
  <script src="js/generative-2026-09-22-v01.js"></script>
  <script src="js/pressure-2026-09-22-v01.js"></script>
  <script src="js/atmosphere-2026-09-22-v01.js"></script>
  <script>
    (() => {
      const resetButton = document.getElementById('reset-ui');
      const infoButton = document.getElementById('info-ui');
      let resetFlashTimer;

      resetButton?.addEventListener('click', (event) => {
        event.stopPropagation();
        clearTimeout(resetFlashTimer);
        resetButton.classList.add('is-flashing');
        resetFlashTimer = setTimeout(() => {
          resetButton.classList.remove('is-flashing');
        }, 220);
        if (window.HarmSound) window.HarmSound.cues.uiClick(0.85);
        if (typeof resetScene === 'function') resetScene();
      });

      infoButton?.addEventListener('click', (event) => {
        event.stopPropagation();
        if (window.HarmSound) window.HarmSound.cues.uiClick(0.85);
        infoOpen = !infoOpen;
        infoButton.setAttribute('aria-expanded', String(infoOpen));
      });
    })();
  </script>
<script src="../exhibition-bridge-2026-09-22-v01.js"></script></body>
</html>
