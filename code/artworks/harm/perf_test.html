<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0} #canvas-holder{width:1920px;height:1080px} #status-message{display:none}</style></head><body><div id="canvas-holder"></div><div id="status-message"></div><pre id="out">running</pre><script src="p5.js"></script><script src="sketch.js"></script><script>
let perfSamples=[]; let origDraw=null; let burnTimer=null;
setTimeout(()=>{
  origDraw=draw;
  draw=function(){ const t=performance.now(); origDraw(); perfSamples.push(performance.now()-t); if(perfSamples.length>1000) perfSamples.shift(); };
  burnTimer=setInterval(()=>{ try{ triggerBurn(null); }catch(e){ document.getElementById('out').textContent='ERR '+e.stack; clearInterval(burnTimer); } },220);
},500);
setTimeout(()=>{
  clearInterval(burnTimer);
  perfSamples.sort((a,b)=>a-b);
  const avg=perfSamples.reduce((a,b)=>a+b,0)/Math.max(1,perfSamples.length);
  const p95=perfSamples[Math.floor(perfSamples.length*.95)]||0;
  const mx=perfSamples[perfSamples.length-1]||0;
  document.getElementById('out').textContent=JSON.stringify({samples:perfSamples.length,avg,p95,max:mx,fps:frameRate(),smoke:smoke.length,carbon:carbonDust.length,ash:ash.length,debris:debris.length,stains:stains.length,pollution,burnCount});
  noLoop();
},12000);
</script></body></html>
